name: shellcheck

on:
  pull_request:
    branches:
      - zebra-mining
  push:
    branches:
      - zebra-mining

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run shellcheck
        run: |
          # Lint the project's own shell scripts. Vendored third-party
          # scripts under 3rdparty/ are excluded.
          find . -name '*.sh' -not -path './3rdparty/*' -print0 \
            | xargs -0 -r shellcheck
