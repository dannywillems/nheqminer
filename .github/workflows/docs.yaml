name: docs

on:
  pull_request:
    branches:
      - zebra-mining
  push:
    branches:
      - zebra-mining

jobs:
  build-docs:
    name: Build documentation site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: doc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      # Builds the site, which imports the build scripts via the @scripts
      # alias; a broken import or broken doc link fails the build.
      - name: Build site
        run: npx docusaurus build
