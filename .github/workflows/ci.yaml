name: CI

on:
  pull_request:
    branches:
      - zebra-mining
  push:
    branches:
      - zebra-mining

jobs:
  build-linux:
    name: Build (Debian/Ubuntu, CPU xenoncat)
    # Pinned to 24.04: the project uses the legacy CMake FindBoost module,
    # which is removed on newer images (Boost 1.90 / CMake 4.x, policy
    # CMP0167), so ubuntu-latest will break the build once it advances.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run the same script the documentation embeds, so the published
      # build instructions are verified on every change.
      - name: Build via scripts/build-debian.sh
        run: ./scripts/build-debian.sh

  build-docker:
    name: Build (Docker image)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build via scripts/build-docker.sh
        run: ./scripts/build-docker.sh
