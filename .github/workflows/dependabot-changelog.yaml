name: dependabot-changelog

on:
  pull_request:
    branches:
      - zebra-mining

# Allow the job to commit the changelog entry back to the Dependabot PR branch.
permissions:
  contents: write

jobs:
  changelog:
    name: Add changelog entry
    # Only run on Dependabot's own pull requests.
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Add changelog entry
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: ./.github/scripts/add-dependabot-changelog-entry.sh

      - name: Commit and push
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog change to commit."
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email \
            "49699333+dependabot[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "CHANGELOG: record dependency update (#${PR_NUMBER})"
          git push
